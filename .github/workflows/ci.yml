name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hack0_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hack0_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: lockfile uses the public registry
        run: "! grep -q 'vercel.security' bun.lock"
      - run: bun run lint
      - run: DATABASE_URL=$TEST_DATABASE_URL bun run --filter hack0-web db:migrate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run quality
      - name: build and smoke-test the production site
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # Publishable keys are public by design (they ship in the browser bundle); this is the Clerk development instance.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFpci1sYW1iLTMxLmNsZXJrLmFjY291bnRzLmRldiQ
        run: |
          bun run scripts/seed-fixture.ts
          bun run build
          bun run start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000 && break; sleep 1; done
          bun run scripts/smoke.ts http://localhost:3000
